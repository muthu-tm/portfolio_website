<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d">
<title id="t">Governed multi-agent Generative AI reference architecture</title>
<desc id="d">Reference architecture by Muthu Thavamani, Generative AI and Forward Deployed Engineer: enterprise data sources feed hybrid RAG retrieval (pgvector plus BM25 with reciprocal rank fusion), a LangGraph orchestrator runs planner, analyst and action agents through an MCP tool gateway, policy guardrails with groundedness evaluation and human approval gate the enterprise copilot, and an AIDLC lifecycle takes the system from discovery to production monitoring.</desc>
