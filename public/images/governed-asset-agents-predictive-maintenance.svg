<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
<title id="t">Governed asset agent predicting equipment failure</title>
<desc id="d">Governed asset-management AI agent: a telemetry forecast flags rising failure risk on a pump, and the agent drafts a work order that passes policy checks and waits for human approval.</desc>
<style>
.ti{font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;fill:#eef0ff;font-weight:500}
.mo{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#9ea3cc;letter-spacing:.5px}
.lb{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#a5b4fc;letter-spacing:1.6px}
.bx{fill:#1d1f3b;stroke:#353867;stroke-width:1}
.hi{fill:#152f3a;stroke:#5eead4;stroke-width:1.2}
.hv{fill:#24245a;stroke:#a5b4fc;stroke-width:1.2}
.am{fill:#2c2616;stroke:#f2b84b;stroke-width:1.2}
.ln{stroke:#5eead4;stroke-width:1.4;fill:none}
.lt{stroke:#5eead4;stroke-width:1.3;fill:none;opacity:.8}
.li{stroke:#a5b4fc;stroke-width:1.3;fill:none;opacity:.8}
.dash{stroke-dasharray:4 4}
.pf{fill:none;stroke:#5eead4;stroke-width:2.2;stroke-linecap:square}
@media (prefers-reduced-motion: reduce){.pf{display:none}}
</style>
<rect width="720" height="300" fill="#14152b"/>

<rect class="bx" x="24" y="24" width="400" height="252"/>
<text class="lb" x="40" y="50" text-anchor="start">ASSET P-14 · VIBRATION FORECAST</text>
<line x1="44" y1="250" x2="404" y2="250" stroke="#353867"/><line x1="44" y1="70" x2="44" y2="250" stroke="#353867"/><line x1="44" y1="120" x2="404" y2="120" stroke="#f2b84b" stroke-dasharray="3 5" opacity=".7"/><text class="mo" x="404" y="114" text-anchor="end" style="fill:#f2b84b">failure threshold</text>
<path d="M44 214 L80 206 L112 212 L146 196 L178 202 L210 188 L240 192 L268 176" stroke="#a5b4fc" stroke-width="2" fill="none"/>
<path d="M268 176 L300 160 L334 140 L366 124 L398 104" stroke="#5eead4" stroke-width="2" fill="none" class="dash"/>
<path d="M268 176 L300 150 L334 124 L366 100 L398 80 L398 128 L366 146 L334 156 L300 170 Z" fill="#5eead4" opacity=".12"/>
<circle cx="366" cy="124" r="5" fill="#f2b84b"/>
<line x1="268" y1="70" x2="268" y2="250" stroke="#353867" stroke-dasharray="2 4"/><text class="mo" x="274" y="84">forecast →</text>
<rect class="hv" x="448" y="24" width="248" height="252"/>
<text class="ti" x="464" y="54">Asset agent</text><text class="mo" x="464" y="72">policy-bound · auditable</text>
<line x1="460" y1="88" x2="684" y2="88" stroke="#353867"/><text class="ti" x="464" y="111" style="font-size:13px">Forecast failure risk</text>
<path d="M666 102 l4 4 l8 -9" stroke="#5eead4" stroke-width="1.8" fill="none"/>
<line x1="460" y1="124" x2="684" y2="124" stroke="#353867"/><text class="ti" x="464" y="147" style="font-size:13px">Draft work order</text>
<path d="M666 138 l4 4 l8 -9" stroke="#5eead4" stroke-width="1.8" fill="none"/>
<line x1="460" y1="160" x2="684" y2="160" stroke="#353867"/><text class="ti" x="464" y="183" style="font-size:13px">Policy &amp; budget check</text>
<path d="M666 174 l4 4 l8 -9" stroke="#5eead4" stroke-width="1.8" fill="none"/>
<line x1="460" y1="196" x2="684" y2="196" stroke="#353867"/><text class="ti" x="464" y="219" style="font-size:13px">Human approval</text>
<rect x="668" y="208" width="9" height="9" fill="#f2b84b"/>
<rect x="464" y="236" width="104" height="28" fill="#5eead4"/><text class="mo" x="516" y="254" text-anchor="middle" style="fill:#062a26">APPROVE</text><rect x="576" y="236" width="104" height="28" fill="none" stroke="#353867"/><text class="mo" x="628" y="254" text-anchor="middle">HOLD</text>
<path class="fx" d="M44 214 L80 206 L112 212 L146 196 L178 202 L210 188 L240 192 L268 176 L300 160 L334 140 L366 124" fill="none" stroke="none"/>
<path class="fx" d="M44 250 H404" fill="none" stroke="none"/>
<path class="pf" d="M44 214 L80 206 L112 212 L146 196 L178 202 L210 188 L240 192 L268 176 L300 160 L334 140 L366 124" stroke-dasharray="14 388" stroke-dashoffset="14"><animate attributeName="stroke-dashoffset" values="14;-388" dur="6.3s" begin="0.0s" repeatCount="indefinite"/></path>
<path class="pf" d="M44 250 H404" stroke-dasharray="14 400" stroke-dashoffset="14"><animate attributeName="stroke-dashoffset" values="14;-400" dur="6.5s" begin="0.7s" repeatCount="indefinite"/></path>
