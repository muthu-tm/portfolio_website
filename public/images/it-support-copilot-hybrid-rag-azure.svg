<path class="pf" d="M220 220 C244 220 244 184 268 184" stroke-dasharray="14 109" stroke-dashoffset="14"><animate attributeName="stroke-dashoffset" values="14;-109" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></path>
<path class="pf" d="M392 176 H440" stroke-dasharray="14 88" stroke-dashoffset="14"><animate attributeName="stroke-dashoffset" values="14;-88" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></path>
