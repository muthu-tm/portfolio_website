<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
<title id="t">Universal AI copilot over Model Context Protocol</title>
<desc id="d">Universal AI copilot: a RAG chat assistant connects through a secured MCP gateway to enterprise tools such as CRM, ERP, ticketing and the knowledge base using tool calling.</desc>
<style>
.ti{font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;fill:#eef0ff;font-weight:500}
.mo{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#9ea3cc;letter-spacing:.5px}
.lb{font-family:'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#a5b4fc;letter-spacing:1.6px}
.bx{fill:#1d1f3b;stroke:#353867;stroke-width:1}
.hi{fill:#152f3a;stroke:#5eead4;stroke-width:1.2}
.hv{fill:#24245a;stroke:#a5b4fc;stroke-width:1.2}
.am{fill:#2c2616;stroke:#f2b84b;stroke-width:1.2}
.ln{stroke:#5eead4;stroke-width:1.4;fill:none}
.lt{stroke:#5eead4;stroke-width:1.3;fill:none;opacity:.8}
.li{stroke:#a5b4fc;stroke-width:1.3;fill:none;opacity:.8}
.dash{stroke-dasharray:4 4}
.pf{fill:none;stroke:#5eead4;stroke-width:2.2;stroke-linecap:square}
@media (prefers-reduced-motion: reduce){.pf{display:none}}
</style>
<rect width="720" height="300" fill="#14152b"/>

<rect class="bx" x="24" y="24" width="240" height="252"/>
<text class="lb" x="40" y="50" text-anchor="start">COPILOT CHAT</text>
<rect x="96" y="66" width="152" height="40" fill="#2a2a66"/><text class="ti" x="108" y="91" style="font-size:12px">Open orders for Acme?</text>
<rect x="40" y="118" width="190" height="70" fill="none" stroke="#5eead4"/><text class="ti" x="52" y="140" style="font-size:12px">3 open orders, 1 delayed.</text><text class="mo" x="52" y="158">via ERP · CRM</text><text class="mo" x="52" y="174" style="fill:#5eead4">[1] [2] sources</text>
<rect x="96" y="200" width="152" height="40" fill="#2a2a66"/><text class="ti" x="108" y="225" style="font-size:12px">Notify the account owner</text>
<rect class="hv" x="306" y="110" width="148" height="80"/>
<text class="ti" x="320" y="140">MCP gateway</text><text class="mo" x="320" y="158">secured · scoped</text><text class="mo" x="320" y="176" style="fill:#5eead4">tool-calling</text>
<path class="ln" d="M264 150 H306"/>
<circle cx="285" cy="150" r="3" fill="#5eead4"/>
<rect class="bx" x="496" y="24" width="200" height="54"/>
<text class="ti" style="font-size:14px" x="508" y="48.0">CRM</text><text class="mo" x="508" y="64.0">accounts</text>
<path class="lt" d="M454 150 C475 150 475 51 496 51"/>
<circle cx="496" cy="51" r="3" fill="#5eead4"/>
<rect class="hi" x="496" y="90" width="200" height="54"/>
<text class="ti" style="font-size:14px" x="508" y="114.0">ERP</text><text class="mo" x="508" y="130.0">orders</text>
<path class="lt" d="M454 150 C475 150 475 117 496 117"/>
<circle cx="496" cy="117" r="3" fill="#5eead4"/>
<rect class="bx" x="496" y="156" width="200" height="54"/>
<text class="ti" style="font-size:14px" x="508" y="180.0">Ticketing</text><text class="mo" x="508" y="196.0">incidents</text>
<path class="lt" d="M454 150 C475 150 475 183 496 183"/>
<circle cx="496" cy="183" r="3" fill="#5eead4"/>
<rect class="bx" x="496" y="222" width="200" height="54"/>
<text class="ti" style="font-size:14px" x="508" y="246.0">Knowledge base</text><text class="mo" x="508" y="262.0">embeddings</text>
<path class="lt" d="M454 150 C475 150 475 249 496 249"/>
<circle cx="496" cy="249" r="3" fill="#5eead4"/>
<path class="pf" d="M264 150 H306" stroke-dasharray="14 82" stroke-dashoffset="14"><animate attributeName="stroke-dashoffset" values="14;-82" dur="2.6s" begin="0.0s" repeatCount="indefinite"/></path>
<path class="pf" d="M454 150 C475 150 475 51 496 51" stroke-dasharray="14 164" stroke-dashoffset="14"><animate attributeName="stroke-dashoffset" values="14;-164" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></path>
<path class="pf" d="M454 150 C475 150 475 117 496 117" stroke-dasharray="14 101" stroke-dashoffset="14"><animate attributeName="stroke-dashoffset" values="14;-101" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></path>
<path class="pf" d="M454 150 C475 150 475 183 496 183" stroke-dasharray="14 101" stroke-dashoffset="14"><animate attributeName="stroke-dashoffset" values="14;-101" dur="2.6s" begin="2.1s" repeatCount="indefinite"/></path>
<path class="pf" d="M454 150 C475 150 475 249 496 249" stroke-dasharray="14 164" stroke-dashoffset="14"><animate attributeName="stroke-dashoffset" values="14;-164" dur="2.6s" begin="2.8s" repeatCount="indefinite"/></path>
